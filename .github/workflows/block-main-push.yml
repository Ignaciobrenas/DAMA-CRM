name: Block Direct Push to Main / Master

on:
  push:
    branches:
      - main
      - master

jobs:
  enforce-branch-policy:
    name: Enforce Branch & PR Policy
    runs-on: ubuntu-latest
    steps:
      - name: Reject Direct Pushes to Production Branches
        run: |
          echo "=========================================================================="
          echo "🚨 ERROR: EMPUJE DIRECTO BLOQUEADO (BRANCH PROTECTION POLICY)"
          echo "=========================================================================="
          echo "Los empujes directos ('git push') a las ramas 'main' y 'master' están estrictamente PROHIBIDOS."
          echo ""
          echo "👉 POLÍTICA DE DESPLIEGUE DAMA-CRM:"
          echo "   * TODO el trabajo debe subirse a la rama 'staging'."
          echo "   * NUNCA subas directamente a 'main' ni 'master'."
          echo ""
          echo "👉 Flujo de trabajo obligatorio:"
          echo "   1. Crea tu rama de trabajo:     git checkout -b feature/mi-funcionalidad"
          echo "   2. Realiza tus commits locales: git commit -m 'feat: detalle'"
          echo "   3. Fusiona o empuja a staging:  git push origin staging"
          echo "   4. Las ramas 'main'/'master' solo reciben cambios validados desde 'staging'."
          echo "=========================================================================="
          exit 1
