name: CI Lint & Typecheck Quality Gate

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-quality:
    name: Core Backend (TypeScript & Prisma Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: core/package-lock.json

      - name: Install Core Dependencies
        working-directory: core
        run: npm ci

      - name: Generate Prisma Types
        working-directory: core
        run: npx prisma generate

      - name: Typecheck Backend (tsc --noEmit)
        working-directory: core
        run: npx tsc --noEmit

      - name: Run Backend Unit & Integration Tests
        working-directory: core
        run: npm test

  frontend-quality:
    name: Client Frontend (TypeScript & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Frontend Application
        working-directory: client
        run: npm run build
