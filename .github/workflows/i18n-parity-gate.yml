name: i18n Localization Integrity & Translation Parity Gate

on:
  push:
    branches:
      - main
      - master
      - staging
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - staging

jobs:
  verify-i18n-parity:
    name: 11-Language Translation Parity Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Verify All 11 Locales Synchronized (ES, CA, EN, FR, DE, IT, PT, AR, ZH, JA, RU)
        run: |
          node scripts/verify_i18n_parity.js
