<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="custBg" x1="0" y1="0" x2="1000" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" rx="16" fill="url(#custBg)"/>
  <rect width="1000" height="560" rx="16" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <rect width="1000" height="42" fill="#090D16" rx="16 16 0 0"/>
  <circle cx="28" cy="21" r="6" fill="#EF4444"/>
  <circle cx="48" cy="21" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="21" r="6" fill="#10B981"/>
  <text x="500" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">DAMA-CRM — Personalización Total: Escala UI, Tipografía, Iconos y Temas</text>

  <!-- Left: Settings Control Panel -->
  <rect x="24" y="60" width="460" height="475" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="92" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Ajustes Visuales &amp; Accesibilidad</text>
  <text x="44" y="112" fill="#94A3B8" font-family="sans-serif" font-size="11">Configura el entorno a la medida de tu equipo</text>

  <!-- Setting 1: UI Scale -->
  <rect x="44" y="130" width="420" height="74" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="60" y="154" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Escala Global de la Interfaz (Zoom UI)</text>
  <text x="60" y="172" fill="#94A3B8" font-family="sans-serif" font-size="10">80% → 130% sin perder nitidez vectorial</text>
  <line x1="60" y1="188" x2="380" y2="188" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="260" cy="188" r="8" fill="#60A5FA"/>
  <text x="400" y="192" fill="#60A5FA" font-family="sans-serif" font-size="11" font-weight="700">105%</text>

  <!-- Setting 2: Font Size -->
  <rect x="44" y="216" width="420" height="74" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="60" y="240" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Tamaño Tipográfico Base</text>
  <rect x="60" y="254" width="46" height="24" rx="6" fill="#1E293B"/><text x="83" y="270" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">XS</text>
  <rect x="114" y="254" width="46" height="24" rx="6" fill="#1E293B"/><text x="137" y="270" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">SM</text>
  <rect x="168" y="254" width="46" height="24" rx="6" fill="#3B82F6"/><text x="191" y="270" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">MD</text>
  <rect x="222" y="254" width="46" height="24" rx="6" fill="#1E293B"/><text x="245" y="270" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">LG</text>
  <rect x="276" y="254" width="46" height="24" rx="6" fill="#1E293B"/><text x="299" y="270" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">XL</text>

  <!-- Setting 3: Icon Style -->
  <rect x="44" y="302" width="420" height="74" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="60" y="326" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Estilo de Iconografía Lucide</text>
  <rect x="60" y="340" width="110" height="24" rx="6" fill="#8B5CF6"/><text x="115" y="356" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Animado (Bounce)</text>
  <rect x="180" y="340" width="90" height="24" rx="6" fill="#1E293B"/><text x="225" y="356" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Sólido</text>
  <rect x="280" y="340" width="90" height="24" rx="6" fill="#1E293B"/><text x="325" y="356" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Minimalista</text>

  <!-- Setting 4: Branding Color -->
  <rect x="44" y="388" width="420" height="74" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="60" y="412" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Color Primario Corporativo</text>
  <circle cx="70" cy="438" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="100" cy="438" r="10" fill="#10B981"/>
  <circle cx="130" cy="438" r="10" fill="#8B5CF6"/>
  <circle cx="160" cy="438" r="10" fill="#F59E0B"/>
  <circle cx="190" cy="438" r="10" fill="#EF4444"/>
  <circle cx="220" cy="438" r="10" fill="#06B6D4"/>

  <rect x="44" y="474" width="420" height="42" rx="8" fill="#10B981"/>
  <text x="254" y="500" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Guardar y Persistir en Base de Datos</text>

  <!-- Right: Live Preview Panel -->
  <rect x="508" y="60" width="468" height="475" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="528" y="92" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Previsualización en Vivo</text>

  <rect x="528" y="112" width="428" height="405" rx="10" fill="#0F172A" stroke="#334155"/>
  
  <!-- Mini mockup sidebar -->
  <rect x="528" y="112" width="120" height="405" fill="#1E293B" rx="10 0 0 10"/>
  <text x="544" y="140" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="800">DAMA-CRM</text>
  <rect x="536" y="156" width="104" height="24" rx="6" fill="#2563EB"/>
  <text x="548" y="172" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="700">Inicio</text>
  <text x="548" y="200" fill="#94A3B8" font-family="sans-serif" font-size="9">Calendario</text>
  <text x="548" y="226" fill="#94A3B8" font-family="sans-serif" font-size="9">Mi Tiempo</text>
  <text x="548" y="252" fill="#94A3B8" font-family="sans-serif" font-size="9">Ventas</text>
  <text x="548" y="278" fill="#94A3B8" font-family="sans-serif" font-size="9">Facturas</text>

  <!-- Mini mockup content -->
  <rect x="664" y="130" width="276" height="80" rx="8" fill="#1E293B"/>
  <text x="680" y="154" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">¡Todo se sincroniza al instante!</text>
  <text x="680" y="174" fill="#94A3B8" font-family="sans-serif" font-size="10">Los cambios de diseño persisten en tu perfil y empresa de forma idempotente.</text>
</svg>
