<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="300" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Background Window -->
  <rect width="1000" height="560" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="560" rx="16" stroke="#334155" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="1000" height="42" fill="#090D16" rx="16 16 0 0"/>
  <circle cx="28" cy="21" r="6" fill="#EF4444"/>
  <circle cx="48" cy="21" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="21" r="6" fill="#10B981"/>
  <text x="500" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DAMA-CRM — Panel Principal &amp; Métricas en Tiempo Real</text>

  <!-- Greeting Banner -->
  <rect x="24" y="60" width="952" height="74" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="0"/>
  <circle cx="60" cy="97" r="22" fill="#3B82F6" fill-opacity="0.2"/>
  <path d="M60 85v4m0 16v4m8.5-12.5h-4m-13 0h-4m15.2 6.7l-2.8-2.8m-9.2-9.2l-2.8-2.8m14.8 0l-2.8 2.8m-9.2 9.2l-2.8 2.8" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  <text x="96" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">¡Buenos días, Ignacio!</text>
  <text x="96" y="112" fill="#94A3B8" font-family="sans-serif" font-size="12">Domingo, 27 de Septiembre • 11:20 AM • Hora Local Sincronizada</text>
  <rect x="830" y="80" width="130" height="34" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981"/>
  <text x="895" y="102" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">● Sistema Activo</text>

  <!-- Metric Cards -->
  <!-- Card 1: Ventas -->
  <rect x="24" y="150" width="226" height="110" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="180" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600">Ventas en Pipeline</text>
  <text x="44" y="215" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800">128.450 €</text>
  <text x="44" y="240" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="600">↑ +18.4% este mes</text>

  <!-- Card 2: Facturación -->
  <rect x="266" y="150" width="226" height="110" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="286" y="180" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600">Facturación Emitida</text>
  <text x="286" y="215" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800">94.820 €</text>
  <text x="286" y="240" fill="#60A5FA" font-family="sans-serif" font-size="11" font-weight="600">IVA + IRPF Desglosado</text>

  <!-- Card 3: Proyectos & Tiempo -->
  <rect x="508" y="150" width="226" height="110" rx="12" fill="#1E293B" stroke="#334155"/>
