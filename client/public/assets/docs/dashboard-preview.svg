  <text x="528" y="215" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800">38.5 h / sem</text>
  <text x="528" y="240" fill="#A78BFA" font-family="sans-serif" font-size="11" font-weight="600">100% Conforme Ley</text>

  <!-- Card 4: Tickets & SLAs -->
  <rect x="750" y="150" width="226" height="110" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="770" y="180" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600">Mesa de Ayuda (SLA)</text>
  <text x="770" y="215" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800">98.2% Cumpl.</text>
  <text x="770" y="240" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="600">0 incidencias críticas</text>

  <!-- Chart & Activity Panels -->
  <rect x="24" y="276" width="580" height="260" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="306" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Evolución de Ingresos y Cobros (2026)</text>
  <!-- Chart visual polyline -->
  <path d="M44 480 Q 140 430, 200 450 T 350 370 T 480 340 T 560 320" fill="none" stroke="url(#blueGrad)" stroke-width="3.5"/>
  <path d="M44 480 Q 140 430, 200 450 T 350 370 T 480 340 T 560 320 L 560 500 L 44 500 Z" fill="url(#blueGrad)" fill-opacity="0.1"/>

  <!-- Right Panel: Agenda & Reminders -->
  <rect x="620" y="276" width="356" height="260" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="640" y="306" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Agenda &amp; Próximos Eventos</text>
  
  <rect x="640" y="324" width="316" height="56" rx="8" fill="#0F172A" stroke="#3B82F6"/>
  <text x="654" y="346" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Reunión de Cierre — Acme Corp</text>
  <text x="654" y="366" fill="#94A3B8" font-family="sans-serif" font-size="10">12:30 - 13:30 • Google Meet • Sincronizado</text>

  <rect x="640" y="392" width="316" height="56" rx="8" fill="#0F172A" stroke="#8B5CF6"/>
  <text x="654" y="414" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Sprint Review — DAMA 2.0</text>
  <text x="654" y="434" fill="#94A3B8" font-family="sans-serif" font-size="10">16:00 - 17:00 • Sala Principal • Equipo Tech</text>

  <rect x="640" y="460" width="316" height="56" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="654" y="482" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Vencimiento Factura #FAC-2026-089</text>
  <text x="654" y="502" fill="#94A3B8" font-family="sans-serif" font-size="10">Recordatorio automático enviado al cliente</text>
</svg>
