<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="invBg" x1="0" y1="0" x2="1000" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" rx="16" fill="url(#invBg)"/>
  <rect width="1000" height="560" rx="16" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <rect width="1000" height="42" fill="#090D16" rx="16 16 0 0"/>
  <circle cx="28" cy="21" r="6" fill="#EF4444"/>
  <circle cx="48" cy="21" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="21" r="6" fill="#10B981"/>
  <text x="500" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">DAMA-CRM — Facturación Legal ISO 19005-1, Descuentos, Retenciones IRPF y Rectificativas</text>

  <!-- Summary KPI Badges -->
  <rect x="24" y="60" width="952" height="64" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="88" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Base Imponible Total</text>
  <text x="44" y="112" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="800">84.250,00 €</text>

  <text x="260" y="88" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">IVA Repercutido (21%)</text>
  <text x="260" y="112" fill="#60A5FA" font-family="sans-serif" font-size="18" font-weight="800">17.692,50 €</text>

  <text x="480" y="88" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Retenciones IRPF (15%)</text>
  <text x="480" y="112" fill="#F87171" font-family="sans-serif" font-size="18" font-weight="800">- 4.250,00 €</text>

  <text x="700" y="88" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Total Facturado Líquido</text>
  <text x="700" y="112" fill="#34D399" font-family="sans-serif" font-size="18" font-weight="800">97.692,50 €</text>

  <!-- Main Invoice Document Canvas Mockup -->
  <rect x="24" y="140" width="600" height="395" rx="12" fill="#FFFFFF"/>
  <!-- Invoice Header inside paper -->
  <text x="50" y="180" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="800">FACTURA RECTIFICATIVA</text>
  <text x="50" y="198" fill="#64748B" font-family="sans-serif" font-size="11">Nº REC-2026-004 • Motivo: R1 Devolución de Mercancía</text>
  <text x="480" y="180" fill="#2563EB" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="end">DAMA-CRM</text>

  <!-- Items Table inside paper -->
  <rect x="50" y="220" width="508" height="26" fill="#F1F5F9" rx="4"/>
  <text x="60" y="237" fill="#475569" font-family="sans-serif" font-size="10" font-weight="700">CONCEPTO</text>
  <text x="320" y="237" fill="#475569" font-family="sans-serif" font-size="10" font-weight="700">CANT.</text>
  <text x="390" y="237" fill="#475569" font-family="sans-serif" font-size="10" font-weight="700">DTO.%</text>
  <text x="530" y="237" fill="#475569" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">TOTAL</text>

  <text x="60" y="268" fill="#1E293B" font-family="sans-serif" font-size="11">Abono Servidores Dedicados</text>
  <text x="330" y="268" fill="#1E293B" font-family="sans-serif" font-size="11">1</text>
  <text x="400" y="268" fill="#1E293B" font-family="sans-serif" font-size="11">0%</text>
  <text x="530" y="268" fill="#EF4444" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="end">- 1.200,00 €</text>

  <text x="60" y="300" fill="#1E293B" font-family="sans-serif" font-size="11">Abono Mantenimiento Anual</text>
  <text x="330" y="300" fill="#1E293B" font-family="sans-serif" font-size="11">1</text>
  <text x="400" y="300" fill="#1E293B" font-family="sans-serif" font-size="11">10%</text>
  <text x="530" y="300" fill="#EF4444" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="end">- 540,00 €</text>

  <line x1="50" y1="380" x2="558" y2="380" stroke="#CBD5E1"/>
  <text x="380" y="410" fill="#475569" font-family="sans-serif" font-size="11">Subtotal:</text>
  <text x="530" y="410" fill="#1E293B" font-family="sans-serif" font-size="11" text-anchor="end">- 1.740,00 €</text>
  <text x="380" y="430" fill="#475569" font-family="sans-serif" font-size="11">IVA (21%):</text>
  <text x="530" y="430" fill="#1E293B" font-family="sans-serif" font-size="11" text-anchor="end">- 365,40 €</text>
  <text x="380" y="455" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="800">Total Abono:</text>
  <text x="530" y="455" fill="#EF4444" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="end">- 2.105,40 €</text>

  <!-- Right Actions Panel -->
  <rect x="640" y="140" width="336" height="395" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="660" y="172" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Acciones Directas</text>
  
  <rect x="660" y="190" width="296" height="42" rx="8" fill="#3B82F6"/>
  <text x="808" y="216" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Descargar PDF Oficial ISO 19005-1</text>

  <rect x="660" y="244" width="296" height="42" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981"/>
  <text x="808" y="270" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Enviar por Email al Cliente</text>

  <rect x="660" y="298" width="296" height="42" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="808" y="324" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Duplicar Documento</text>

  <rect x="660" y="352" width="296" height="42" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="808" y="378" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Crear Factura Proforma</text>

  <!-- QR / Audit stamp -->
  <rect x="660" y="416" width="296" height="95" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="676" y="440" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700">● Firma Digital &amp; Trazabilidad</text>
  <text x="676" y="460" fill="#94A3B8" font-family="sans-serif" font-size="10">Huella SHA-256 Verificada</text>
  <text x="676" y="478" fill="#64748B" font-family="sans-serif" font-size="9" font-mono>Hash: a8f9c21b90de44719e8...</text>
</svg>
