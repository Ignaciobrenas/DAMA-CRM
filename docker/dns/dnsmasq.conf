# ============================================================================
# DAMA-CRM Wildcard DNS Resolver Configuration
# Resolves all *.dama.com and *.damacrm.local subdomains to local host
# ============================================================================

# Do not read host /etc/resolv.conf
no-resolv

# Upstream public DNS forwarders
server=1.1.1.1
server=8.8.8.8
server=8.8.4.4

# Wildcard domain mapping: *.dama.com -> 127.0.0.1
address=/dama.com/127.0.0.1
address=/.dama.com/127.0.0.1

# Specific subdomains
address=/god.dama.com/127.0.0.1
address=/app.dama.com/127.0.0.1
address=/ignacio-corp.dama.com/127.0.0.1
address=/admin.dama.com/127.0.0.1

# Local development domains
address=/damacrm.local/127.0.0.1
address=/.damacrm.local/127.0.0.1

# Network & Interface binding
listen-address=0.0.0.0
bind-interfaces

# Cache configuration
cache-size=1000

# Logging
log-queries
log-facility=-
